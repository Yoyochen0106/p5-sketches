<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>p5 sketches</title>
    <script>
        // apply the saved theme before first paint to avoid a flash
        try {
            var t = JSON.parse(localStorage.getItem('p5s:global') || '{}').theme;
            if (t === 'light' || t === 'auto' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* ignore */ }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="p5.min.js"></script>
    <script type="module" src="core/app.js"></script>
</head>
<body>
    <div id="app"></div>
    <noscript>This site needs JavaScript.</noscript>
</body>
</html>
